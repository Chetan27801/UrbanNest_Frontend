[build]
  # Install all dependencies including dev dependencies
  command = "npm ci --include=dev && npm run build"
  publish = "dist"

[build.environment]
  # Unset NODE_ENV during build so dev dependencies are installed
  NODE_ENV = ""

# [context.production]
#   # After build, you can set runtime env vars if needed
#   environment = { VITE_API_URL = "https://your-api.com", VITE_SOCKET_URL = "https://your-socket.com" }
# 
# Note: It's better to set VITE_API_URL and VITE_SOCKET_URL in Netlify dashboard
# under Site settings → Environment variables so they're not in your code
